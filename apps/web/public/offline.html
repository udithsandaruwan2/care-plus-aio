<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3d4a" />
    <title>Care Plus — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #061820;
        --fg: #e8f4f7;
        --muted: #8ab0bb;
        --accent: #2dd4bf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, 'Segoe UI', sans-serif;
        background: radial-gradient(ellipse at top, #0b3d4a 0%, var(--bg) 55%);
        color: var(--fg);
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #042f2e;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Care Plus</h1>
      <p>
        You’re offline. The app shell is still here — reconnect to sync matches, messages, and
        care requests.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
