# Production-oriented Compose (Step 73 deploy)

# Pulls the GHCR image (no bind mounts). TLS terminates at Caddy
# (see docs/ops/deploy.md and docs/ops/tls-proxy.md).
# uvicorn is bound to loopback on the host only — not the public internet.

name: care-plus-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careplus}
      POSTGRES_USER: ${POSTGRES_USER:-careplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/home/postgres/pgdata/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-careplus} -d ${POSTGRES_DB:-careplus}']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  backend:
    image: ${CAREPLUS_IMAGE:-ghcr.io/udithsandaruwan2/care-plus-backend:latest}
    restart: unless-stopped
    command:
      ['uvicorn', 'careplus.asgi:application', '--host', '0.0.0.0', '--port', '8000', '--workers', '2']
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: careplus.settings.prod
      MIGRATE_ON_START: '0'
      FAISS_ARTIFACT_DIR: /ml/artifacts
      AHP_WEIGHTS_PATH: /config/ahp_weights.json
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - ml_data:/ml
      - ../config:/config:ro
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/v1/health/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  worker:
    image: ${CAREPLUS_IMAGE:-ghcr.io/udithsandaruwan2/care-plus-backend:latest}
    restart: unless-stopped
    command: ['celery', '-A', 'careplus', 'worker', '-l', 'info']
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: careplus.settings.prod
      FAISS_ARTIFACT_DIR: /ml/artifacts
      AHP_WEIGHTS_PATH: /config/ahp_weights.json
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - ml_data:/ml
      - ../config:/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  beat:
    image: ${CAREPLUS_IMAGE:-ghcr.io/udithsandaruwan2/care-plus-backend:latest}
    restart: unless-stopped
    command: ['celery', '-A', 'careplus', 'beat', '-l', 'info']
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: careplus.settings.prod
      FAISS_ARTIFACT_DIR: /ml/artifacts
      AHP_WEIGHTS_PATH: /config/ahp_weights.json
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - ml_data:/ml
      - ../config:/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      CADDY_SITE: ${CADDY_SITE:-http://localhost}
      ACME_EMAIL: ${ACME_EMAIL:-ops@localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

volumes:
  db_data:
  redis_data:
  ml_data:
  caddy_data:
  caddy_config:
