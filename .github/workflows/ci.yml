name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tools
        run: pip install ruff==0.7.1 black==24.10.0
      - name: Ruff
        run: ruff check backend
      - name: Black
        run: black --check backend

  frontend-format:
    name: Frontend format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prettier check
        run: npx --yes prettier@3.3.3 --check .

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck web + api-client
        run: |
          pnpm --filter @care-plus/api-client exec tsc --noEmit
          pnpm --filter @care-plus/web typecheck

  web-bundle:
    name: Web bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @care-plus/web build
      - name: Entry chunk budget
        run: pnpm --filter @care-plus/web check-bundle

  docker-build:
    name: Docker build (backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t care-plus-backend:ci ./backend

  backend-test:
    name: Backend tests (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env from example
        run: cp .env.example .env
      - name: Start db, redis, backend
        run: docker compose -f infra/docker-compose.yml up -d --build db redis backend
      - name: Wait for API health
        run: |
          set -e
          for i in $(seq 1 72); do
            if curl -fsS http://localhost:8000/api/v1/health/; then
              echo "healthy"
              exit 0
            fi
            echo "waiting ($i)…"
            sleep 5
          done
          echo "=== backend logs ==="
          docker compose -f infra/docker-compose.yml logs --no-color backend | tail -n 200
          exit 1
      - name: Migrate
        run: docker compose -f infra/docker-compose.yml exec -T backend python manage.py migrate --noinput
      - name: Run Django tests
        run: docker compose -f infra/docker-compose.yml exec -T backend python manage.py test -v1
      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
